name: shoe-shop-e2e
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: e2e-root-only
      MYSQL_DATABASE: shoe_shop_e2e
      MYSQL_USER: e2e
      MYSQL_PASSWORD: e2e-password
    ports:
      - "127.0.0.1:${E2E_DB_PORT:-43306}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 40
